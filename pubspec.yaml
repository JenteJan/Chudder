name: chudder
description: Chudder — an opinionated cross-platform Jellyfin client, forked from Fladder.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.12.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # Icons
  cupertino_icons: ^1.0.8
  iconsax_plus: ^1.0.0

  # Network and HTTP
  chopper: ^8.4.0
  cached_network_image: ^3.4.1
  http: ^1.5.0
  flutter_cache_manager: ^3.4.1
  file: ^7.0.1
  connectivity_plus: ^7.0.0
  punycoder: ^0.3.0
  web_socket_channel: ^3.0.3

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # JSON and Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # Logging
  logging: ^1.3.0

  # Internationalization
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  # The load-time benchmark (lib/perf_bench) points both at a profile directory.
  path_provider_platform_interface: ^2.1.2
  path_provider_windows: ^2.3.0
  shared_preferences_platform_interface: ^2.4.1
  shared_preferences_windows: ^2.4.1

  # Media
  media_kit: ^1.2.2 # Primary package.
  media_kit_video: ^2.0.0 # For video rendering.
  media_kit_libs_video: ^1.0.7 # Native video dependencies.
  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.0
  audio_session: ^0.2.4 # Audio focus, so playing pauses other apps' audio on Android.
  fvp: ^0.40.0
  pip: ^0.0.3
  video_player: ^2.10.0
  flutter_chrome_cast: ^2.0.0 # Chromecast sender via the native Google Cast SDK. Android/iOS only.

  image: ^4.5.4 # For saving screenshots.

  # UI Components
  dynamic_color: ^1.8.1
  flutter_svg: ^2.2.0
  animations: ^2.0.11
  automatic_animated_list: ^1.1.0
  page_transition: ^2.2.1
  sticky_headers: ^0.3.0+2
  flutter_staggered_grid_view: ^0.7.0
  sliver_tools: ^0.2.12
  square_progress_indicator: ^0.0.8
  flutter_blurhash: ^0.9.1
  extended_image: ^10.0.1
  flutter_widget_from_html: ^0.17.0
  font_awesome_flutter: ^11.0.0
  reorderable_grid: ^1.0.12
  overflow_view: ^0.7.0
  flutter_sticky_header: ^0.11.0
  markdown_widget: ^2.3.2+8
  palette_generator_master: ^1.0.1

  # Navigation
  auto_route: ^11.2.0
  url_launcher: ^6.3.2
  flutter_custom_tabs: ^2.4.0

  # Utility
  path: ^1.9.1
  file_picker: ^13.3.3
  transparent_image: ^2.0.1
  universal_html: ^2.2.4
  clock: ^1.1.2
  collection: ^1.19.1

  # Device and System
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  wakelock_plus: ^1.3.2
  screen_brightness: ^2.1.7
  volume_controller: ^3.7.1
  window_manager: ^0.5.1
  smtc_windows: ^1.1.0
  # smtc_windows ships code generated for exactly this runtime; a newer one
  # throws at start-up and leaves the media controls dead.
  flutter_rust_bridge: 2.11.1
  background_downloader: ^9.2.3
  screen_retriever: ^0.2.0
  desktop_multi_window: ^0.3.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.1
  permission_handler: ^13.0.2

  # Data
  drift: ^2.28.2
  drift_flutter: ^0.3.1
  drift_sync: ^0.14.0
  drift_db_viewer: ^2.1.0

  # Other
  async: ^2.13.0
  xid: ^1.2.1
  desktop_drop: ^0.8.4
  flexible_scrollbar: ^0.1.3
  flutter_typeahead: ^6.0.0
  share_plus: ^13.3.1
  pretty_qr_code: ^3.0.1
  archive: ^4.0.7
  dart_mappable: ^4.6.1
  flutter_native_splash: ^2.4.7
  macos_window_utils: ^1.9.0

  # Fix cjk font rendering issue on Windows
  chinese_font_library: ^1.2.0
  multicast_dns: ^0.3.3
  windows_taskbar: ^1.1.2

  local_auth_android: any
  local_auth_darwin: any
  uuid: any
  material_color_utilities: any
dependency_overrides:
  pip:
    git:
      url: https://github.com/DonutWare/pip.git
      ref: 0.0.3.1
  media_kit:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: ./libs/universal/media_kit_libs_video
  media_kit_libs_android_video:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: libs/android/media_kit_libs_android_video
  media_kit_libs_ios_video:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: libs/ios/media_kit_libs_ios_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: libs/macos/media_kit_libs_macos_video
  media_kit_libs_windows_video:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: libs/windows/media_kit_libs_windows_video
  media_kit_libs_linux:
    git:
      url: https://github.com/DonutWare/media-kit.git
      ref: cb56b5a6149f1e51086eba473c7e48041c54ab12
      path: libs/linux/media_kit_libs_linux

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  drift_dev: ^2.28.3
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  chopper_generator: ^8.6.0
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  swagger_dart_code_generator: ^4.1.1
  riverpod_generator: ^4.0.0+1
  dart_mappable_builder: ^4.6.4
  auto_route_generator: ^10.2.6
  icons_launcher: ^3.0.2
  pigeon: ^26.1.0

  sqlite3: any
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  assets:
    - icons/
    - assets/fonts/
    - config/
    - assets/mp-font.ttf
    - assets/
    - assets/thumbbar/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/rubik/Rubik-VariableFont_wght.ttf
          style: normal
        - asset: assets/fonts/rubik/Rubik-Italic-VariableFont_wght.ttf
          style: italic

    - family: OpenSans
      fonts:
        - asset: assets/fonts/opensans/OpenSans.ttf
          style: normal
        - asset: assets/fonts/opensans/OpenSans-Italic.ttf
          style: italic

flutter_native_splash:
  color: "#0A1A30"
  color_dark: "#0A1A30"
  image: icons/production/chudder_icon.png
  image_dark: icons/production/chudder_icon.png
  android: true
  ios: false
  web: false

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="A simple cross-platform Jellyfin client." />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fladder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fladder</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Cast Web Sender (Chromium browsers only). Initialised with the
    Jellyfin receiver app id; sets window.__fladderCastReady so the Dart side
    (cast_web_impl.dart) knows casting is available. cast_sender.js calls
    __onGCastApiAvailable once the framework loads.
  -->
  <script>
    window.__fladderCastReady = false;
    window.__onGCastApiAvailable = function (isAvailable) {
      if (isAvailable && window.cast && window.cast.framework) {
        try {
          cast.framework.CastContext.getInstance().setOptions({
            receiverApplicationId: 'F007D354',
            autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
          });
          window.__fladderCastReady = true;
        } catch (e) {
          console.warn('Cast init failed', e);
        }
      }
    };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: Flutter checks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  linting:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    permissions:
      # Reads the code; the analyzer action may comment on the PR.
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Fetch version info
        run: |
          # Extract flutter_version from .fvmrc
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@865bf5a4dd2fbf1d6d7077e8a58b9f9a04c713b3 # v2.0
        with:
          emojis: false
          fail-on: info
          line-length: 120
